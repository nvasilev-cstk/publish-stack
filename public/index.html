<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Publish Everything</title>
<script src="https://unpkg.com/@contentstack/app-sdk@2/dist/index.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 16px;
    font-size: 13px;
    color: #1a1a1a;
    background: #fff;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .stack-line { color: #666; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  label.dry-run { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 4px;
    border: 1px solid #6c5ce7;
    background: #6c5ce7;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .progress { margin: 4px 0; }
  .bar { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .bar > div { height: 100%; background: #6c5ce7; width: 0%; }
  .bar.has-failures > div { background: #d9534f; }
  #log {
    margin-top: 10px;
    background: #0f1117;
    color: #d7dae0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    padding: 10px;
    border-radius: 4px;
    height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  #log .error { color: #ff6b6b; }
  #summary { margin-top: 10px; font-weight: 600; }
</style>
</head>
<body>
  <h1>Publish Everything</h1>
  <div class="stack-line" id="stackLine">Connecting to Contentstack...</div>

  <div class="row">
    <label class="dry-run">
      <input type="checkbox" id="dryRun" checked />
      Dry run (list counts only, publish nothing)
    </label>
  </div>
  <div class="row">
    <button id="runButton" disabled>Publish All</button>
  </div>

  <div class="progress">
    Entries: <span id="entriesCount">—</span>
    <div class="bar" id="entriesBar"><div></div></div>
  </div>
  <div class="progress">
    Assets: <span id="assetsCount">—</span>
    <div class="bar" id="assetsBar"><div></div></div>
  </div>

  <div id="summary"></div>
  <div id="log"></div>

<script>
(function () {
  var stackApiKey = null;
  var runButton = document.getElementById('runButton');
  var dryRunCheckbox = document.getElementById('dryRun');
  var stackLine = document.getElementById('stackLine');
  var logEl = document.getElementById('log');
  var summaryEl = document.getElementById('summary');
  var entriesCount = document.getElementById('entriesCount');
  var assetsCount = document.getElementById('assetsCount');
  var entriesBar = document.getElementById('entriesBar').firstElementChild;
  var assetsBar = document.getElementById('assetsBar').firstElementChild;

  function log(message, level) {
    var line = document.createElement('div');
    if (level === 'error') line.className = 'error';
    line.textContent = message;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setProgress(kind, done, total, failed) {
    var countEl = kind === 'entries' ? entriesCount : assetsCount;
    var barEl = kind === 'entries' ? entriesBar : assetsBar;
    countEl.textContent = done + ' / ' + total + (failed ? ' (' + failed + ' failed)' : '');
    barEl.parentElement.classList.toggle('has-failures', failed > 0);
    barEl.style.width = (total ? Math.round((done / total) * 100) : 0) + '%';
  }

  function handleEvent(event) {
    switch (event.type) {
      case 'log':
        log(event.message, event.level);
        break;
      case 'summary':
        entriesCount.textContent = '0 / ' + event.entries;
        assetsCount.textContent = '0 / ' + event.assets;
        summaryEl.textContent =
          'About to publish ' + event.entries + ' entries and ' + event.assets +
          ' assets to "' + event.environment + '" across ' + event.locales + ' locale(s).';
        break;
      case 'progress':
        setProgress(event.kind, event.done, event.total, event.failed);
        break;
      case 'done':
        if (event.dryRun) {
          summaryEl.textContent += ' Dry run — nothing was published.';
        } else {
          summaryEl.textContent =
            'Done. Entries: ' + event.entriesPublished + ' published, ' + event.entriesFailed + ' failed. ' +
            'Assets: ' + event.assetsPublished + ' published, ' + event.assetsFailed + ' failed.';
        }
        runButton.disabled = false;
        break;
      case 'fatal':
        log('Fatal error: ' + event.message, 'error');
        runButton.disabled = false;
        break;
    }
  }

  async function runPublish() {
    runButton.disabled = true;
    logEl.innerHTML = '';
    summaryEl.textContent = '';
    setProgress('entries', 0, 0, 0);
    setProgress('assets', 0, 0, 0);

    var dryRun = dryRunCheckbox.checked;
    var params = new URLSearchParams({ dryRun: String(dryRun) });
    if (stackApiKey) params.set('stackApiKey', stackApiKey);

    var response;
    try {
      response = await fetch('/publish-stream?' + params.toString());
    } catch (err) {
      log('Failed to reach the publish backend: ' + err.message, 'error');
      runButton.disabled = false;
      return;
    }

    if (!response.ok) {
      var body = await response.json().catch(function () { return {}; });
      log(body.error || ('Request failed with status ' + response.status), 'error');
      runButton.disabled = false;
      return;
    }

    var reader = response.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';

    for (;;) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });
      var lines = buffer.split('\n');
      buffer = lines.pop();
      for (var i = 0; i < lines.length; i++) {
        if (!lines[i]) continue;
        try {
          handleEvent(JSON.parse(lines[i]));
        } catch (err) {
          log('Could not parse progress event: ' + lines[i], 'error');
        }
      }
    }
  }

  runButton.addEventListener('click', runPublish);

  function sdkUnavailable(reason) {
    stackLine.textContent = 'Could not load stack info from the App SDK: ' + reason;
    // Still allow running — the backend's own stack-key check (when
    // stackApiKey isn't sent) simply won't have that extra safety net.
    runButton.disabled = false;
  }

  if (typeof ContentstackAppSdk === 'undefined') {
    sdkUnavailable('SDK script did not load');
  } else {
    try {
      ContentstackAppSdk.init().then(function (appSdk) {
        return appSdk.stack.getData();
      }).then(function (stack) {
        stackApiKey = stack.api_key;
        stackLine.textContent = 'Stack: ' + stack.name + ' (' + stack.api_key + ')';
        runButton.disabled = false;
      }).catch(function (err) {
        sdkUnavailable(err.message);
      });
    } catch (err) {
      sdkUnavailable(err.message);
    }
  }
})();
</script>
</body>
</html>
