<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Publish Everything</title>
<script src="https://unpkg.com/@contentstack/app-sdk@2/dist/index.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 16px;
    font-size: 13px;
    color: #1a1a1a;
    background: #fff;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .stack-line { color: #666; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  label.dry-run { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 4px;
    border: 1px solid #6c5ce7;
    background: #6c5ce7;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .progress { margin: 4px 0; }
  .bar { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .bar > div { height: 100%; background: #6c5ce7; width: 0%; }
  .bar.has-failures > div { background: #d9534f; }
  #log {
    margin-top: 10px;
    background: #0f1117;
    color: #d7dae0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    padding: 10px;
    border-radius: 4px;
    height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  #log .error { color: #ff6b6b; }
  #summary { margin-top: 10px; font-weight: 600; }
</style>
</head>
<body>
  <h1>Publish Everything</h1>
  <div class="stack-line" id="stackLine">Connecting to Contentstack...</div>

  <div class="row">
    <label class="dry-run">
      <input type="checkbox" id="dryRun" checked />
      Dry run (list counts only, publish nothing)
    </label>
  </div>
  <div class="row">
    <button id="runButton" disabled>Publish All</button>
  </div>

  <div class="stack-line" id="phaseLine"></div>
  <div class="progress">
    Entries: <span id="entriesCount">—</span>
    <div class="bar" id="entriesBar"><div></div></div>
  </div>
  <div class="progress">
    Assets: <span id="assetsCount">—</span>
    <div class="bar" id="assetsBar"><div></div></div>
  </div>

  <div id="summary"></div>
  <div id="log"></div>

<script>
(function () {
  var stackApiKey = null;
  var runButton = document.getElementById('runButton');
  var dryRunCheckbox = document.getElementById('dryRun');
  var stackLine = document.getElementById('stackLine');
  var phaseLine = document.getElementById('phaseLine');
  var logEl = document.getElementById('log');
  var summaryEl = document.getElementById('summary');
  var entriesCount = document.getElementById('entriesCount');
  var assetsCount = document.getElementById('assetsCount');
  var entriesBar = document.getElementById('entriesBar').firstElementChild;
  var assetsBar = document.getElementById('assetsBar').firstElementChild;

  var PHASE_LABELS = {
    'locales': 'Fetching locales...',
    'content-types': 'Fetching content types...',
    'entries': 'Fetching entries...',
    'assets': 'Fetching assets...',
    'publish-entries': 'Publishing entries...',
    'publish-assets': 'Publishing assets...',
    'done': 'Done.',
  };

  function log(message, level) {
    var line = document.createElement('div');
    if (level === 'error') line.className = 'error';
    line.textContent = message;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // Shows every field the server sent (message, phase, status, errorCode,
  // errorMessage, context, stack, ...) instead of just a bare message, and
  // always dumps the raw object to the console too — see the response
  // there for anything this doesn't render (e.g. a nested `errors` object).
  function logErrorDetails(label, details) {
    details = details || {};
    log(label + (details.message ? ': ' + details.message : ''), 'error');
    if (details.errorMessage && details.errorMessage !== details.message) log('  errorMessage: ' + details.errorMessage, 'error');
    if (details.errorCode !== undefined) log('  errorCode: ' + details.errorCode, 'error');
    if (details.status !== undefined) log('  status: ' + details.status, 'error');
    if (details.phase) log('  phase: ' + details.phase, 'error');
    if (details.context) log('  context: ' + JSON.stringify(details.context), 'error');
    if (details.errors) log('  errors: ' + JSON.stringify(details.errors), 'error');
    log('  (full details logged to the browser console)', 'error');
    console.error(label, details);
  }

  function setProgress(kind, done, total, failed) {
    var countEl = kind === 'entries' ? entriesCount : assetsCount;
    var barEl = kind === 'entries' ? entriesBar : assetsBar;
    countEl.textContent = done + ' / ' + total + (failed ? ' (' + failed + ' failed)' : '');
    barEl.parentElement.classList.toggle('has-failures', failed > 0);
    barEl.style.width = (total ? Math.round((done / total) * 100) : 0) + '%';
  }

  // The widget drives the whole job: it holds `state` between calls and
  // POSTs it right back, since Cloud Functions can't keep it themselves
  // (30s timeout per call — see ../README.md). Each call does ~20s of work.
  async function runPublish() {
    runButton.disabled = true;
    logEl.innerHTML = '';
    summaryEl.textContent = '';
    phaseLine.textContent = '';
    setProgress('entries', 0, 0, 0);
    setProgress('assets', 0, 0, 0);

    var dryRun = dryRunCheckbox.checked;
    var state = undefined;

    for (;;) {
      var response;
      try {
        response = await fetch('/publish-step', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state: state, dryRun: dryRun, stackApiKey: stackApiKey }),
        });
      } catch (err) {
        log('Failed to reach the publish backend: ' + err.message, 'error');
        break;
      }

      var data = await response.json().catch(function () { return {}; });
      console.log('publish-step response', response.status, data);

      if (!response.ok) {
        logErrorDetails('Request failed with status ' + response.status, data);
        break;
      }

      (data.log || []).forEach(function (message) { log(message); });
      if (data.progress) {
        phaseLine.textContent = PHASE_LABELS[data.progress.phase] || data.progress.phase;
        setProgress('entries', data.progress.entries.done, data.progress.entries.total, data.progress.entries.failed);
        setProgress('assets', data.progress.assets.done, data.progress.assets.total, data.progress.assets.failed);
      }

      if (data.error) {
        logErrorDetails('Pipeline error', data.error);
        break;
      }

      if (data.done) {
        var s = data.summary || {};
        summaryEl.textContent = s.dryRun
          ? 'Dry run — would publish ' + s.entries + ' entries and ' + s.assets + ' assets. Nothing was published.'
          : 'Done. Entries: ' + s.entriesPublished + ' published, ' + s.entriesFailed + ' failed. ' +
            'Assets: ' + s.assetsPublished + ' published, ' + s.assetsFailed + ' failed.';
        break;
      }

      state = data.state;
    }

    runButton.disabled = false;
  }

  runButton.addEventListener('click', runPublish);

  function sdkUnavailable(reason) {
    stackLine.textContent = 'Could not load stack info from the App SDK: ' + reason;
    // Still allow running — the backend's own stack-key check (when
    // stackApiKey isn't sent) simply won't have that extra safety net.
    runButton.disabled = false;
  }

  if (typeof ContentstackAppSdk === 'undefined') {
    sdkUnavailable('SDK script did not load');
  } else {
    try {
      ContentstackAppSdk.init().then(function (appSdk) {
        return appSdk.stack.getData();
      }).then(function (stack) {
        stackApiKey = stack.api_key;
        stackLine.textContent = 'Stack: ' + stack.name + ' (' + stack.api_key + ')';
        runButton.disabled = false;
      }).catch(function (err) {
        sdkUnavailable(err.message);
      });
    } catch (err) {
      sdkUnavailable(err.message);
    }
  }
})();
</script>
</body>
</html>
